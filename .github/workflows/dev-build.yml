# Fork-only: builds a signed APK on every push to main and publishes it as
# the rolling "dev" pre-release, so test builds can be sideloaded from a
# stable URL. Not intended for upstream.
name: Dev build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:STORE_PASSWORD \
            --out openCarLauncher-dev.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs openCarLauncher-dev.apk | grep "certificate SHA-256"
          rm "$RUNNER_TEMP/release.jks"

      - name: Publish rolling dev pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev openCarLauncher-dev.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Dev build ($SHORT_SHA)" \
            --notes "Signed test build of \`$SHORT_SHA\`: $(git log -1 --format=%s)"
